name: QA Suite CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

jobs:
  api-tests:
    name: API tests (RestAssured / JUnit5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Run API test suite
        working-directory: api-tests
        run: mvn -B test
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: api-tests/target/surefire-reports

  ui-tests:
    name: UI tests (Selenium / pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        working-directory: ui-tests
        run: pip install -r requirements.txt
      - name: Run UI smoke tests
        working-directory: ui-tests
        run: pytest -m smoke
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: ui-tests/report.html

  db-integrity:
    name: Database integrity tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qa_user
          POSTGRES_PASSWORD: qa_password
          POSTGRES_DB: ecommerce_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa_user -d ecommerce_qa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Load schema and seed data
        run: PGPASSWORD=qa_password psql -h localhost -U qa_user -d ecommerce_qa -f db/init.sql
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: db
        run: pip install -r requirements.txt
      - name: Run DB integrity tests
        working-directory: db
        run: pytest -v

  performance-smoke:
    name: Performance smoke test (Locust)
    runs-on: ubuntu-latest
    needs: [api-tests]   # only run load tests once functional correctness is confirmed
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: performance
        run: pip install -r requirements.txt
      - name: Run a short headless load test
        working-directory: performance
        run: |
          locust -f locustfile.py --host https://fakestoreapi.com \
            --headless -u 20 -r 5 -t 60s --html report.html --exit-code-on-error 1
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance/report.html
