services:
  postgres:
    image: postgres:16-alpine
    container_name: qa_suite_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password
      POSTGRES_DB: ecommerce_qa
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d ecommerce_qa"]
      interval: 5s
      timeout: 3s
      retries: 5
